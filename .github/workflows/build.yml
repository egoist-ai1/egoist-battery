name: Windows build and checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/EgoistBattery/packages.lock.json
      - name: Build, test, package
        run: ./build.ps1
      - name: Isolated install, launch, uninstall
        run: |
          $version = ([xml](Get-Content src/EgoistBattery/EgoistBattery.csproj)).Project.PropertyGroup.Version
          ./scripts/Test-Installer.ps1 -Installer "artifacts/$version/EgoistBattery-$version-Setup-x64.exe" -Output "artifacts/$version/installer-check.json"
      - name: WPF and tray self-check
        run: |
          $version = ([xml](Get-Content src/EgoistBattery/EgoistBattery.csproj)).Project.PropertyGroup.Version
          $checkData = Join-Path $env:RUNNER_TEMP 'EgoistBattery-ui-check'
          $check = Start-Process "artifacts/$version/EgoistBattery.exe" -ArgumentList @('--ui-test', '--data-dir', ('"' + $checkData + '"')) -PassThru
          if (-not $check.WaitForExit(60000) -or $check.ExitCode -ne 0) { throw 'UI self-check failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $checkData 'ui-check.json'))) { throw 'UI receipt missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EgoistBattery-Windows-x64
          path: |
            artifacts/*/EgoistBattery.exe
            artifacts/*/*-Setup-x64.exe
            artifacts/*/*-Portable-x64.zip
            artifacts/*/SHA256SUMS.txt
            artifacts/*/MANIFEST.json
            artifacts/*/installer-check.json
          if-no-files-found: error
          retention-days: 14
